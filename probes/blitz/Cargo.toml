[package]
name = "quantumview-blitz"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# 0.7.10 uses dioxus_cli_config unconditionally; hot-reload enables that dependency.
# Its dev-server connection is disabled in release builds.
dioxus-native = { version = "=0.7.10", default-features = false, features = ["prelude", "system-fonts", "clipboard", "hot-reload"] }
