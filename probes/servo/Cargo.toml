[package]
name = "quantumview-servo"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
servo = { version = "=0.7.0", default-features = false, features = ["bundled", "clipboard", "js_jit"] }
euclid = "0.22"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
url = "2.5"
winit = "=0.30.13"

[patch.crates-io]
servo-paint-api = { path = "vendor/servo-paint-api" }
servo-script = { path = "vendor/servo-script" }
