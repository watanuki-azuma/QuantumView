<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuantumView</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">QuantumView / rendering probe</p>
      <h1>デスクトップUIの比較</h1>
      <p>日本語入力・選択・スクロール・リサイズを確認します。</p>
    </header>
    <section class="editor">
      <label for="note">日本語メモ</label>
      <textarea id="note" spellcheck="false">日本語の入力を試してください。
変換中の文字と確定後の文字を確認します。</textarea>
      <div class="toolbar">
        <button id="clear" type="button">クリア</button>
        <span id="count" class="count"></span>
      </div>
    </section>
    <section id="cards" class="cards"></section>
  </main>
</body>
</html>
